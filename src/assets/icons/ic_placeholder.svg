<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 128 128"
    fill="none">

    <!-- Background -->
    <rect
        x="8"
        y="8"
        width="112"
        height="112"
        rx="20"
        fill="#F5F5F5"/>

    <!-- Plate -->
    <circle
        cx="64"
        cy="70"
        r="26"
        stroke="#CFCFCF"
        stroke-width="4"/>

    <!-- Cloche -->
    <path
        d="M40 60
           C40 46 51 36 64 36
           C77 36 88 46 88 60"
        stroke="#A8A8A8"
        stroke-width="4"
        stroke-linecap="round"/>

    <!-- Cloche Handle -->
    <circle
        cx="64"
        cy="32"
        r="4"
        fill="#A8A8A8"/>

    <!-- Base -->
    <line
        x1="34"
        y1="60"
        x2="94"
        y2="60"
        stroke="#A8A8A8"
        stroke-width="4"
        stroke-linecap="round"/>

    <!-- Fork -->
    <path
        d="M22 36V92
           M18 36V52
           M22 36V52
           M26 36V52"
        stroke="#B8B8B8"
        stroke-width="3"
        stroke-linecap="round"/>

    <!-- Knife -->
    <path
        d="M106 36
           C102 46 102 58 106 68
           V92"
        stroke="#B8B8B8"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>